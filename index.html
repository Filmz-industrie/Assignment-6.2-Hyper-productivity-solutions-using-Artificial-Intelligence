<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix-It Fic Generator</title>
    <style>
        :root {
            --primary-color: #6366f1;
            --primary-hover: #4f46e5;
            --bg-color: #0f172a;
            --container-bg: #1e293b;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --border-color: #334155;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--container-bg);
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
            width: 100%;
            max-width: 700px;
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
            color: var(--primary-color);
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 30px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 12px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            background-color: #0f172a;
            color: var(--text-main);
            font-size: 16px;
        }

        input[type="text"]:focus, textarea:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
        }

        textarea {
            resize: vertical;
            min-height: 120px;
        }

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        button:disabled {
            background-color: var(--border-color);
            cursor: not-allowed;
        }

        .result-container {
            margin-top: 30px;
            display: none; /* Hidden by default */
        }

        .result-container h2 {
            margin-bottom: 15px;
            font-size: 20px;
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 10px;
        }

        .story-content {
            background-color: #0f172a;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            line-height: 1.6;
            white-space: pre-wrap;
            font-family: 'Georgia', serif;
        }

        .loader {
            text-align: center;
            margin-top: 20px;
            display: none;
            color: var(--primary-color);
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Fix-It Fic Generator</h1>
        <p class="subtitle">Rewrite your favorite media exactly the way it should have been.</p>

        <div class="form-group">
            <label for="mediaInput">Which Universe / Media?</label>
            <input type="text" id="mediaInput" placeholder="e.g., Star Wars, Harry Potter, Game of Thrones..." required>
        </div>

        <div class="form-group">
            <label for="changeInput">What do you want to fix or change?</label>
            <textarea id="changeInput" placeholder="e.g., Ned Stark survives and escapes to Essos..." required></textarea>
        </div>

        <button id="generateBtn" onclick="generateStory()">Write My Fanfiction</button>

        <div class="loader" id="loader">Consulting the multiverse... Generating story...</div>

        <div class="result-container" id="resultContainer">
            <h2>Your Custom Fanfiction</h2>
            <div class="story-content" id="storyContent"></div>
        </div>
    </div>

    <script>
        async function generateStory() {
            const media = document.getElementById('mediaInput').value;
            const changes = document.getElementById('changeInput').value;
            const generateBtn = document.getElementById('generateBtn');
            const loader = document.getElementById('loader');
            const resultContainer = document.getElementById('resultContainer');
            const storyContent = document.getElementById('storyContent');

            if (!media || !changes) {
                alert("Please fill out both fields!");
                return;
            }

            // UI Updates: Disable button, show loading
            generateBtn.disabled = true;
            loader.style.display = "block";
            resultContainer.style.display = "none";

            /* 
            ===============================================================
            BACKEND INTEGRATION NOTE:
            Right now, this simulates a 3-second delay to pretend it's generating text.
            To make this real, you would replace the setTimeout block below with an actual 
            `fetch()` request to your own backend server (e.g., Node.js/Express or Python/Flask).
            Your backend would then securely call an AI API like Gemini, OpenAI, or Claude.
            
            Example of real fetch:
            
            try {
                const response = await fetch('https://your-api.com/generate', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ media: media, changes: changes })
                });
                const data = await response.json();
                storyContent.innerText = data.story;
            } catch (error) {
                storyContent.innerText = "Error generating story.";
            }
            ===============================================================
            */

            // Simulated AI Generation (Mock Data)
            setTimeout(() => {
                const mockStory = `Title: A Different Path in ${media}\n\n` + 
                `The world of ${media} was never quite the same after that fateful day. \n\n` +
                `Instead of the tragedy everyone expected, things took a sharp turn: ${changes}. \n\n` +
                `As the dust settled, the heroes realized that this new reality brought a whole set of different challenges. But for the first time in a long time, there was genuine hope. The end. \n\n` +
                `(Note: This is a placeholder text! To get full stories, connect this front-end to an AI API backend!)`;

                // Display result
                loader.style.display = "none";
                storyContent.innerText = mockStory;
                resultContainer.style.display = "block";
                generateBtn.disabled = false;
                
            }, 2500); // 2.5 second simulated delay
        }
    </script>
</body>
</html>
